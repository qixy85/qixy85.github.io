// ===== 导出/导入已检查(跨设备同步) =====
(function(){
  var eb=document.createElement('button'); eb.textContent='导出已检查'; eb.className='clearbtn'; eb.style.cssText='margin-top:4px';
  var ib=document.createElement('button'); ib.textContent='导入已检查'; ib.className='clearbtn'; ib.style.cssText='margin-top:4px';
  var ctl=document.getElementById('checkctl');
  if(ctl){ ctl.appendChild(eb); ctl.appendChild(ib); }
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.35);z-index:3000;display:none;align-items:center;justify-content:center';
  ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:16px;max-width:90vw;width:480px;box-sizing:border-box">'+
    '<div style="font-size:15px;font-weight:bold;margin-bottom:8px">同步已检查名单（共 <span id="synccnt">0</span> 家）</div>'+
    '<textarea id="syncText" rows="10" style="width:100%;box-sizing:border-box;font-size:12px;border:1px solid #ddd;border-radius:6px;padding:8px" placeholder="国家编码，每行一个"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
    '<button id="syncCopy" style="flex:1;padding:8px;border:none;border-radius:6px;background:#eee;cursor:pointer;font-size:13px">复制名单</button>'+
    '<button id="syncImport" style="flex:1;padding:8px;border:none;border-radius:6px;background:#4363d8;color:#fff;cursor:pointer;font-size:13px">导入(替换勾选)</button>'+
    '<button id="syncMerge" style="flex:1;padding:8px;border:none;border-radius:6px;background:#ff9800;color:#fff;cursor:pointer;font-size:13px">合并追加</button>'+
    '<button id="syncClose" style="flex:1;padding:8px;border:none;border-radius:6px;background:#eee;cursor:pointer;font-size:13px">关闭</button></div></div>';
  document.body.appendChild(ov);
  function openPanel(mode){
    var c=document.getElementById('synccnt'); if(c) c.textContent=checked.size;
    var t=document.getElementById('syncText');
    if(mode==='export' && t) t.value=[...checked].join('\n');
    ov.style.display='flex';
  }
  eb.onclick=function(){ openPanel('export'); };
  ib.onclick=function(){ openPanel('import'); };
  document.getElementById('syncClose').onclick=function(){ ov.style.display='none'; };
  document.getElementById('syncCopy').onclick=function(){
    var t=document.getElementById('syncText');
    if(!t.value) return;
    t.select(); t.setSelectionRange(0,999999);
    try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  };
  function parseCodes(txt){
    var s=new Set();
    (txt.match(/[PH]\d+/g)||[]).forEach(function(c){ s.add(c); });
    return s;
  }
  document.getElementById('syncImport').onclick=function(){
    checked=parseCodes(document.getElementById('syncText').value);
    saveChecked(); refreshVisibility(); ov.style.display='none';
  };
  document.getElementById('syncMerge').onclick=function(){
    var s=parseCodes(document.getElementById('syncText').value);
    s.forEach(function(c){ checked.add(c); });
    saveChecked(); refreshVisibility(); ov.style.display='none';
  };
})();

</script>

, "type": "诊所", "members": [{"n": 1, "name": "苏州齿丽方口腔诊所", "addr": "苏州太湖国家旅游度假区香山路16号540幢太湖中心MallL4-27/28/29/30", "c": "H32050603875", "bno": 7338, "lat": 31.228177, "lng": 120.414306, "dA": 27.5, "dB": 17.4, "mx": 27.5, "core": false}], "color": "#4363d8"}, {"gi": 93, "size": 1, "area": "", "type": "诊所", "members": [{"n": 1, "name": "苏州市吴中区牙德康口腔门诊部", "addr": "苏州市吴中区东山镇洞庭路洞庭苑旁", "c": "H32050603203", "bno": 7175, "lat": 31.083301, "lng": 120.413854, "dA": 32.6, "dB": 27.9, "mx": 32.6, "core": false}], "color": "#f58231"}, {"gi": 94, "size": 1, "area": "", "type": "诊所", "members": [{"n": 1, "name": "苏州吴中洞庭门诊部", "addr": "苏州市吴中区东山镇紫金路58号", "c": "H32050600920", "bno": 4421, "lat": 31.078684, "lng": 120.405111, "dA": 33.5, "dB": 28.8, "mx": 33.5, "core": false}], "color": "#911eb4"}, {"gi": 95, "size": 1, "area": "", "type": "诊所", "members": [{"n": 1, "name": "苏州市吴中区洁爱口腔门诊部", "addr": "苏州市吴中区金庭镇金庭路5号商业A幢103-1室", "c": "H32059902511", "bno": 4469, "lat": 31.135604, "lng": 120.319849, "dA": 38.3, "dB": 30.3, "mx": 38.3, "core": false}], "color": "#46f0f0"}, {"gi": 96, "size": 1, "area": "", "type": "诊所", "members": [{"n": 1, "name": "苏州吴中传师中医诊所", "addr": "苏州市吴中区金庭镇金庭路101-11号二楼", "c": "H32050603982", "bno": 7382, "lat": 31.136102, "lng": 120.308897, "dA": 39.3, "dB": 31.1, "mx": 39.3, "core": false}], "color": "#f032e6"}]};
const allPts = [];
DATA.groups.forEach(g=>g.members.forEach(m=>allPts.push([m.lat,m.lng])));
DATA.clinicGroups.forEach(g=>g.members.forEach(m=>allPts.push([m.lat,m.lng])));
const map = L.map('map', {zoomControl:true}).fitBounds(L.latLngBounds(allPts).pad(0.06));
const gaode = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'], maxZoom:18, detectRetina:true, attribution:'高德'});
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, detectRetina:true, attribution:'OSM'});
gaode.addTo(map);
L.control.layers({'高德地图': gaode, 'OpenStreetMap': osm}).addTo(map);

// ===== 类型切换 =====
const MODES = ['药店','诊所','全部'];
let mode = '药店';
// ===== 已检查状态(按版本管理,批量名单变动时自动同步) =====
const CK_VER = '2026-08-26-1';
let checked = new Set();
try {
  if (localStorage.getItem('wz_ck_ver') === CK_VER) {
    checked = new Set(JSON.parse(localStorage.getItem('wz_ck_v1')||'[]'));
  } else {
    checked = new Set(DATA.initChecked||[]);
    localStorage.setItem('wz_ck_ver', CK_VER);
    localStorage.setItem('wz_ck_v1', JSON.stringify([...checked]));
  }
} catch(e){ if(checked.size===0) checked = new Set(DATA.initChecked||[]); }
function saveChecked(){ try{ localStorage.setItem('wz_ck_v1', JSON.stringify([...checked])); }catch(e){} }
let hideChecked = true;
// ===== 数据与标记 =====
const allGroups = DATA.groups.concat(DATA.clinicGroups);
const byCode = {};
function mkIcon(m, g){
  const done = checked.has(m.c);
  const html = '<div style="background:'+(done?'#9e9e9e':g.color)+
    (done?';border:2px solid #4caf50':'')+'">'+(done?'✓':m.n)+'</div>';
  return L.divIcon({className:'num-icon'+(done?' done':''), html:html, iconSize:[24,24], iconAnchor:[12,12]});
}
function groupListHtml(g){
  let h='<div style="max-height:45vh;overflow:auto;min-width:250px"><b>'+g.type+'第'+g.gi+'组 · '+g.size+'家</b>'+(g.area?(' · '+g.area):'');
  g.members.forEach(m=>{
    h+='<div style="margin-top:5px;padding-top:5px;border-top:1px dotted #ccc"><b>#'+m.n+'</b> '+m.name+'<br>'+
      '<span style="color:#666;font-size:11px">'+m.addr+'</span></div>';
  });
  return h+'</div>';
}
function popupHtml(g, m){
  const done = checked.has(m.c);
  return '<b>'+g.type+'第'+g.gi+'组 #'+m.n+' · '+m.name+'</b><br>'+
    '<span style="color:#444">定点单位编号 <b>'+m.bno+'</b> · 国家代码 '+m.c+'</span><br>'+
    m.addr+
    '<br><button class="ckbtn '+(done?'done':'not')+'" id="ckbtn-'+m.c+'" onclick="toggleCheck(\''+m.c+'\')">'+
    (done?'✓ 已检查(点此取消)':'标记为已检查')+'</button>'+
    '<hr>'+groupListHtml(g);
}
allGroups.forEach(g=>{
  g.members.forEach(m=>{
    const mk = L.marker([m.lat,m.lng], {icon:mkIcon(m,g)}).addTo(map).bindPopup(popupHtml(g,m));
    byCode[m.c] = {mk, m, g};
  });
  if(g.members.length>1){
    const latlngs = g.members.map(m=>[m.lat,m.lng]);
    L.polygon(latlngs.concat([latlngs[0]]), {color:g.color, weight:1, opacity:.35, fillOpacity:.04}).addTo(map);
  }
});
// ===== 活动分组(按模式) =====
function activeGroups(){
  return mode==='全部' ? allGroups : allGroups.filter(g=>g.type===mode);
}
// ===== 图例重建 =====
function buildLegend(){
  const groups = activeGroups();
  let html='';
  groups.forEach(g=>{
    const star=g.members.filter(m=>m.core).length;
    let rows='';
    g.members.forEach(m=>{
      rows+='<div class="mitem" data-c="'+m.c+'">'+
        '<input type="checkbox" class="ckbox" data-c="'+m.c+'" onchange="toggleCheck(\''+m.c+'\')">'+
        '<span class="mname">'+m.n+'. <b>#'+m.bno+'</b> '+m.name+'</span></div>';
    });
    html+='<div class="grp" data-gi="'+g.gi+'" data-type="'+g.type+'"><span class="dot" style="background:'+g.color+'"></span>'+
      '<b>'+g.type+'第'+g.gi+'组</b> '+g.size+'家'+(star?(' / 两家近'+star+'家'):'')+(g.area?(' · '+g.area):'')+
      '<span class="toggle">▾</span><div class="mlist" style="display:none">'+rows+'</div></div>';
  });
  document.getElementById('legend').innerHTML=html;
  document.querySelectorAll('.grp').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.classList.contains('ckbox')||e.target.closest('.ckbox')) return;
      const t=el.dataset.type, gi=+el.dataset.gi;
      const g = allGroups.find(x=>x.type===t && x.gi===gi);
      const ms = g ? g.members.map(m=>byCode[m.c]).filter(o=>o&&o.mk) : [];
      if(ms.length) map.fitBounds(L.latLngBounds(ms.map(o=>o.mk.getLatLng())).pad(0.6));
      const ml=el.querySelector('.mlist');
      if(ml) ml.style.display = ml.style.display==='none' ? 'block' : 'none';
    });
  });
  document.getElementById('cktotal').textContent = groups.reduce((s,g)=>s+g.members.length,0);
}
// ===== 可见性刷新 =====
function refreshVisibility(){
  const act = new Set();
  activeGroups().forEach(g=>g.members.forEach(m=>act.add(m.c)));
  let cnt=0;
  Object.keys(byCode).forEach(c=>{
    const {mk,m,g}=byCode[c];
    const done=checked.has(c);
    if(done && act.has(c)) cnt++;
    mk.setIcon(mkIcon(m,g));
    const visible = act.has(c) && !(done&&hideChecked);
    if(!visible && map.hasLayer(mk)) map.removeLayer(mk);
    if(visible && !map.hasLayer(mk)) map.addLayer(mk);
  });
  document.querySelectorAll('.ckbox').forEach(cb=>{ cb.checked=checked.has(cb.dataset.c); });
  document.querySelectorAll('.mitem').forEach(el=>{ el.classList.toggle('done', checked.has(el.dataset.c)); });
  document.getElementById('ckcnt').textContent=cnt;
  document.getElementById('hidebtn').classList.toggle('off', !hideChecked);
  document.getElementById('hidebtn').textContent = hideChecked?'显示已检查':'隐藏已检查';
}
window.toggleCheck=function(c){
  if(checked.has(c)) checked.delete(c); else checked.add(c);
  saveChecked(); refreshVisibility();
};
document.getElementById('hidebtn').addEventListener('click',()=>{ hideChecked=!hideChecked; refreshVisibility(); });
document.getElementById('clearbtn').addEventListener('click',()=>{ checked.clear(); saveChecked(); refreshVisibility(); });
// ===== 类型切换按钮 =====
const modeBtn=document.getElementById('modebtn');
modeBtn.addEventListener('click',()=>{
  mode=MODES[(MODES.indexOf(mode)+1)%MODES.length];
  modeBtn.textContent='显示:'+mode;
  buildLegend(); refreshVisibility();
});
// ===== 搜索 =====
const allMembers=allGroups.flatMap(g=>g.members.map(m=>({m,g})));
const sIn=document.getElementById('search'), sBox=document.getElementById('searchResults');
function activeMembers(){
  const act=new Set();
  activeGroups().forEach(g=>g.members.forEach(m=>act.add(m.c)));
  return allMembers.filter(x=>act.has(x.m.c));
}
function resetHl(){ allMembers.forEach(x=>{ const o=byCode[x.m.c]; if(o) o.mk.setOpacity(1); }); }
function doSearch(){
  const q=sIn.value.trim().toLowerCase();
  if(!q){ sBox.style.display='none'; sBox.innerHTML=''; resetHl(); return; }
  const hits=activeMembers().filter(x=>{
    const m=x.m;
    return m.name.toLowerCase().includes(q)||String(m.bno).includes(q)||m.c.toLowerCase().includes(q)||m.addr.toLowerCase().includes(q);
  });
  allMembers.forEach(x=>{ const o=byCode[x.m.c]; if(o) o.mk.setOpacity(0.12); });
  hits.forEach(x=>{ const o=byCode[x.m.c]; if(o) o.mk.setOpacity(1); });
  if(hits.length===0){ sBox.innerHTML='<div class="sitem nomatch">未找到匹配</div>'; sBox.style.display='block'; return; }
  sBox.innerHTML=hits.slice(0,40).map((x,i)=>{
    return '<div class="sitem" data-i="'+i+'"><b>#'+x.m.bno+'</b> '+x.m.name+'<span class="sg">'+x.g.type+'第'+x.g.gi+'组</span></div>';
  }).join('');
  sBox.style.display='block';
  sBox.querySelectorAll('.sitem[data-i]').forEach(el=>{
    el.addEventListener('click',()=>{
      const x=hits[+el.dataset.i]; const o=byCode[x.m.c];
      if(!o) return;
      map.flyTo([x.m.lat,x.m.lng], Math.max(map.getZoom(),16));
      setTimeout(()=>{ o.mk.openPopup(); },600);
    });
  });
}
sIn.addEventListener('input',doSearch);
sIn.addEventListener('keydown',e=>{ if(e.key==='Escape'){ sIn.value=''; doSearch(); } });
document.addEventListener('click',e=>{ if(!e.target.closest('#searchWrap')) sBox.style.display='none'; });
// ===== 初始化 =====
modeBtn.textContent='显示:'+mode;
buildLegend();
refreshVisibility();
// ===== 手机端面板开关 =====
function isMobile(){ return window.matchMedia('(max-width: 700px)').matches; }
const panel=document.getElementById('panel'), tg=document.getElementById('togglePanel');
tg.addEventListener('click',()=>{ panel.style.display='block'; tg.style.display='none'; });
document.querySelector('.closePanel').addEventListener('click',()=>{ panel.style.display='none'; tg.style.display='block'; });
if (isMobile()){ panel.style.display='none'; tg.style.display='block'; }
window.addEventListener('resize',()=>{ panel.style.display = isMobile() ? 'none' : 'block'; tg.style.display = isMobile() ? 'block' : 'none'; });

</script>
