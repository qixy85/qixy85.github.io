// ===== 已检查(版本化,初始=检查汇总表84家) =====
const CK_VER = '2026-08-19-3';
let checked = new Set();
try {
  if (localStorage.getItem('sip_ck_ver') === CK_VER) {
    checked = new Set(JSON.parse(localStorage.getItem('sip_ck_v1')||'[]'));
  } else {
    checked = new Set(DATA.initChecked||[]);
    localStorage.setItem('sip_ck_ver', CK_VER);
    localStorage.setItem('sip_ck_v1', JSON.stringify([...checked]));
  }
} catch(e){ checked = new Set(DATA.initChecked||[]); }
function saveChecked(){ try{ localStorage.setItem('sip_ck_v1', JSON.stringify([...checked])); }catch(e){} }
let hideChecked = true;
let selPersons = new Set();   // 多选负责人,空=全部

// ===== 标记 =====
const byE = {};
// 同址(同坐标)机构错开显示
(function(){
  const cnt = {}, idx = {};
  DATA.members.forEach(m=>{ const k=m.lat.toFixed(4)+','+m.lng.toFixed(4); cnt[k]=(cnt[k]||0)+1; });
  DATA.members.forEach(m=>{
    const k=m.lat.toFixed(4)+','+m.lng.toFixed(4);
    if (cnt[k]>1){
      const i = idx[k]=(idx[k]||0)+1;
      const ang=(i-1)/cnt[k]*2*Math.PI, r=0.00016;
      m.lat += r*Math.cos(ang); m.lng += r*Math.sin(ang);
      m.sameAddr = cnt[k];
    }
  });
})();
DATA.members.forEach(m=>{
  const col = DATA.pcolors[m.person] || '#888';
  const mk = L.circleMarker([m.lat,m.lng], {
    radius: 7, color: '#fff', weight: 1.5,
    fillColor: col, fillOpacity: 0.9
  }).addTo(map);
  mk.bindPopup(popupHtml(m));
  byE[m.e] = {mk, m};
});
function popupHtml(m){
  const done = checked.has(m.e);
  return '<b>'+m.name+'</b><br>'+
    '<span style="color:#444">园区代码 <b>'+m.c+'</b> · 国家编号 '+m.e+'</span><br>'+
    m.addr+'<br>负责人: <b>'+m.person+'</b>'+
    (m.sameAddr ? '<div style="color:#c00;font-size:11px">同址共'+m.sameAddr+'家，已错开显示，请逐个查看</div>' : '')+
    '<br>2025年最后检查: <b>'+(m.last||'无')+'</b>'+
    '<br><button class="ckbtn '+(done?'done':'not')+'" onclick="toggleCheck(\''+m.e+'\')">'+
    (done?'✓ 已检查(点此取消)':'标记为已检查')+'</button>';
}
function mkStyle(m){
  const done = checked.has(m.e);
  return { radius: 7, color:'#fff', weight:1.5,
           fillColor: done ? '#9e9e9e' : (DATA.pcolors[m.person]||'#888'),
           fillOpacity: done ? 0.4 : 0.9 };
}

// ===== 图例(负责人多选,可展开看机构清单) =====
function buildLegend(){
  let html = '<div class="pers'+(selPersons.size===0?' active':'')+'" data-p="">';
  html += '<div class="pers-head"><span class="dot" style="background:#555"></span><b>全部</b><span class="cnt2"></span></div>';
  html += '</div>';
  DATA.persons.forEach(p=>{
    const on = selPersons.has(p);
    let items = DATA.members.filter(m=>m.person===p)
      .sort((a,b)=>(checked.has(a.e)?1:0)-(checked.has(b.e)?1:0))   // 未检查在前
      .map(m=>{
        return '<div class="iitem'+(checked.has(m.e)?' done':'')+'">'+
          '<input type="checkbox" class="ckbox" data-e="'+m.e+'" '+(checked.has(m.e)?'checked':'')+'>'+
          '<span class="iname">'+m.name+'</span>'+
          (checked.has(m.e)?'<span class="istat">✓已检查</span>':'')+'</div>';
      }).join('');
    html += '<div class="pers'+(on?' active':'')+'" data-p="'+p+'">'+
      '<div class="pers-head">'+
        '<input type="checkbox" class="pck" data-p="'+p+'" '+(on?'checked':'')+'>'+
        '<span class="dot" style="background:'+(DATA.pcolors[p]||'#888')+'"></span>'+p+
        '<span class="cnt2"></span>'+
        '<span class="toggle">▸</span>'+
      '</div>'+
      '<div class="ilist" style="display:none">'+items+'</div>'+
    '</div>';
  });
  document.getElementById('legend').innerHTML = html;
  document.querySelectorAll('.pers[data-p]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if (e.target.closest('.pck')||e.target.closest('.ckbox')) return;
      const il = el.querySelector('.ilist');
      if (il) {
        // 点名字/箭头 = 展开查看该负责人机构清单
        il.style.display = il.style.display==='none' ? 'block' : 'none';
      } else {
        // 全部行 = 清空负责人筛选
        selPersons.clear();
        buildLegend();
        refreshVisibility();
      }
    });
  });
  document.querySelectorAll('.pck').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const p = cb.dataset.p;
      if (cb.checked) selPersons.add(p); else selPersons.delete(p);
      buildLegend();
      refreshVisibility();
    });
  });
  document.querySelectorAll('.ckbox').forEach(cb=>{
    cb.addEventListener('change',()=>{ window.toggleCheck(cb.dataset.e); });
  });
}

// ===== 可见性 =====
function refreshVisibility(){
  let cnt = 0;
  DATA.members.forEach(m=>{
    const o = byE[m.e];
    const done = checked.has(m.e);
    if (done) cnt++;
    o.mk.setStyle(mkStyle(m));
    const visible = (selPersons.size===0 || selPersons.has(m.person)) && !(done && hideChecked);
    if (!visible && map.hasLayer(o.mk)) map.removeLayer(o.mk);
    if (visible && !map.hasLayer(o.mk)) map.addLayer(o.mk);
  });
  const total = DATA.members.filter(m=> selPersons.size===0 || selPersons.has(m.person)).length;
  document.getElementById('cktotal').textContent = total;
  document.getElementById('ckcnt').textContent = cnt;
  document.getElementById('hidebtn').classList.toggle('off', !hideChecked);
  document.getElementById('hidebtn').textContent = hideChecked ? '显示已检查' : '隐藏已检查';
  // 更新每人 共/已检/剩余
  document.querySelectorAll('.pers').forEach(el=>{
    const p = el.dataset.p;
    const members = p==='' ? DATA.members : DATA.members.filter(m=>m.person===p);
    const tot = members.length;
    const don = members.filter(m=>checked.has(m.e)).length;
    el.querySelector('.cnt2').textContent = '共'+tot+'家 · 已检'+don+'家 · 剩'+(tot-don)+'家';
  });
  // 同步展开清单里的机构勾选状态
  document.querySelectorAll('.ckbox').forEach(cb=>{
    const e = cb.dataset.e;
    cb.checked = checked.has(e);
    const it = cb.closest('.iitem');
    if (it) it.classList.toggle('done', checked.has(e));
  });
}
window.toggleCheck = function(e){
  if (checked.has(e)) checked.delete(e); else checked.add(e);
  saveChecked(); refreshVisibility();
};
document.getElementById('hidebtn').addEventListener('click', ()=>{ hideChecked=!hideChecked; refreshVisibility(); });
document.getElementById('clearbtn').addEventListener('click', ()=>{ checked.clear(); saveChecked(); refreshVisibility(); });

// ===== 查询 =====
const sIn = document.getElementById('search'), sBox = document.getElementById('searchResults');
function resetHl(){ DATA.members.forEach(m=>{ byE[m.e].mk.setStyle(mkStyle(m)); }); }
function doSearch(){
  const q = sIn.value.trim().toLowerCase();
  if (!q){ sBox.style.display='none'; sBox.innerHTML=''; resetHl(); return; }
  const hits = DATA.members.filter(m=>{
    if (selPersons.size>0 && !selPersons.has(m.person)) return false;
    return m.name.toLowerCase().includes(q) || m.e.toLowerCase().includes(q) ||
           m.c.includes(q) || m.addr.toLowerCase().includes(q) || m.person.includes(q);
  });
  DATA.members.forEach(m=>{ const o=byE[m.e]; o.mk.setStyle({...mkStyle(m), fillOpacity: hits.includes(m)?0.9:0.08, opacity: hits.includes(m)?1:0.2}); });
  if (!hits.length){ sBox.innerHTML='<div class="sitem nomatch">未找到匹配</div>'; sBox.style.display='block'; return; }
  sBox.innerHTML = hits.slice(0,40).map((m,i)=>{
    return '<div class="sitem" data-i="'+i+'"><b>'+m.name+'</b><span class="sg">'+m.person+'</span></div>';
  }).join('');
  sBox.style.display='block';
  sBox.querySelectorAll('.sitem[data-i]').forEach(el=>{
    el.addEventListener('click',()=>{
      const m = hits[+el.dataset.i];
      map.flyTo([m.lat,m.lng], Math.max(map.getZoom(),16));
      setTimeout(()=>{ byE[m.e].mk.openPopup(); },600);
    });
  });
}
sIn.addEventListener('input', doSearch);
sIn.addEventListener('keydown', e=>{ if(e.key==='Escape'){ sIn.value=''; doSearch(); } });
document.addEventListener('click', e=>{ if(!e.target.closest('#searchWrap')) sBox.style.display='none'; });

if (isMobile()){ panel.style.display='none'; tg.style.display='block'; }
window.addEventListener('resize', ()=>{ panel.style.display = isMobile() ? 'none' : 'block'; tg.style.display = isMobile() ? 'block' : 'none'; });

buildLegend();
refreshVisibility();

// ===== 导出/导入已检查(跨设备同步) =====
(function(){
  var eb=document.createElement('button'); eb.textContent='导出已检查'; eb.className='clearbtn'; eb.style.cssText='margin-top:4px';
  var ib=document.createElement('button'); ib.textContent='导入已检查'; ib.className='clearbtn'; ib.style.cssText='margin-top:4px';
  var ctl=document.getElementById('checkctl');
  if(ctl){ ctl.appendChild(eb); ctl.appendChild(ib); }
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.35);z-index:3000;display:none;align-items:center;justify-content:center';
  ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:16px;max-width:90vw;width:480px;box-sizing:border-box">'+
    '<div style="font-size:15px;font-weight:bold;margin-bottom:8px">同步已检查名单（共 <span id="synccnt">0</span> 家）</div>'+
    '<textarea id="syncText" rows="10" style="width:100%;box-sizing:border-box;font-size:12px;border:1px solid #ddd;border-radius:6px;padding:8px" placeholder="国家编码，每行一个"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
    '<button id="syncCopy" style="flex:1;padding:8px;border:none;border-radius:6px;background:#eee;cursor:pointer;font-size:13px">复制名单</button>'+
    '<button id="syncImport" style="flex:1;padding:8px;border:none;border-radius:6px;background:#4363d8;color:#fff;cursor:pointer;font-size:13px">导入(替换勾选)</button>'+
    '<button id="syncMerge" style="flex:1;padding:8px;border:none;border-radius:6px;background:#ff9800;color:#fff;cursor:pointer;font-size:13px">合并追加</button>'+
    '<button id="syncClose" style="flex:1;padding:8px;border:none;border-radius:6px;background:#eee;cursor:pointer;font-size:13px">关闭</button></div></div>';
  document.body.appendChild(ov);
  function openPanel(mode){
    var c=document.getElementById('synccnt'); if(c) c.textContent=checked.size;
    var t=document.getElementById('syncText');
    if(mode==='export' && t) t.value=[...checked].join('\n');
    ov.style.display='flex';
  }
  eb.onclick=function(){ openPanel('export'); };
  ib.onclick=function(){ openPanel('import'); };
  document.getElementById('syncClose').onclick=function(){ ov.style.display='none'; };
  document.getElementById('syncCopy').onclick=function(){
    var t=document.getElementById('syncText');
    if(!t.value) return;
    t.select(); t.setSelectionRange(0,999999);
    try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  };
  function parseCodes(txt){
    var s=new Set();
    (txt.match(/[PH]\d+/g)||[]).forEach(function(c){ s.add(c); });
    return s;
  }
  document.getElementById('syncImport').onclick=function(){
    checked=parseCodes(document.getElementById('syncText').value);
    saveChecked(); refreshVisibility(); ov.style.display='none';
  };
  document.getElementById('syncMerge').onclick=function(){
    var s=parseCodes(document.getElementById('syncText').value);
    s.forEach(function(c){ checked.add(c); });
    saveChecked(); refreshVisibility(); ov.style.display='none';
  };
})();


// ===== 云同步(自动跨设备) =====
const CLOUD = {ns:'ckyq1788141037', path:'ck', key:'8b07290847c248e52aba339970bbf41c919aa028f4a4a5917ecb81d61c4432cd'};
let uploadTimer = null;
window.__uploadCK = function(){
  clearTimeout(uploadTimer);
  uploadTimer = setTimeout(function(){
    fetch('https://mantledb.sh/v2/'+CLOUD.ns+'/'+CLOUD.path, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','X-Mantle-Key':CLOUD.key},
      body: JSON.stringify({codes:[...checked], ver:CK_VER})
    }).catch(function(){});
  }, 1200);
};
(function(){
  var orig = saveChecked;
  saveChecked = function(){ orig(); window.__uploadCK(); };
})();
fetch('https://mantledb.sh/v2/'+CLOUD.ns+'/'+CLOUD.path)
 .then(function(r){ return r.json().catch(function(){ return null; }); })
 .then(function(d){
   if (d && Array.isArray(d.codes) && d.ver === CK_VER) {
     checked = new Set(d.codes);
     saveChecked();
     refreshVisibility();
     if (typeof buildLegend === 'function') buildLegend();
   } else {
     window.__uploadCK();
   }
 })
 .catch(function(){ window.__uploadCK(); });

</script>
