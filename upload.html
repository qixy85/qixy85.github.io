<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>图片合成PDF</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
 html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333}
 .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
 h1{font-size:20px;margin:8px 0 4px}
 .sub{color:#888;font-size:13px;margin-bottom:16px}
 #drop{background:#fff;border:2px dashed #bbb;border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;transition:.2s}
 #drop.over{border-color:#4363d8;background:#eef2ff}
 #drop .big{font-size:34px}
 #drop .tip{color:#888;font-size:13px;margin-top:6px}
 #fileInput{display:none}
 .bar{display:flex;align-items:center;gap:8px;margin-top:16px}
 .bar input{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box}
 #pdfBtn{background:#4363d8;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;white-space:nowrap}
 #pdfBtn:disabled{background:#bbb;cursor:not-allowed}
 #list{margin-top:14px}
 .item{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
 .item img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
 .item .inf{flex:1;min-width:0}
 .item .nm{font-size:13px;word-break:break-all}
 .item .sz{color:#999;font-size:11px}
 .item .rm{flex:none;background:#fff;border:1px solid #e0e0e0;color:#c00;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
 #hint{color:#999;font-size:12px;margin-top:10px}
 #progress{display:none;margin-top:12px;background:#fff;border-radius:10px;padding:12px;text-align:center;color:#555;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片合成PDF</h1>
  <div class="sub">选择多张图片，合成一个 PDF，<b>每页一张图片、保持原比例不变</b>、<b>原图直嵌不压缩画质</b>（图片仅在本机处理，不会上传）</div>

  <div id="drop">
    <div class="big">📄</div>
    <div class="tip">点击选择图片，或直接拖拽图片到这里<br>支持多选，每张图片为 PDF 的一页</div>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*">

  <div class="bar">
    <input id="pdfName" placeholder="PDF名称（默认：图片合集）">
    <input id="margin" type="number" min="0" max="200" value="20" title="四周留白(px)" style="width:70px;text-align:center">
    <button id="pdfBtn" disabled>生成PDF下载</button>
  </div>

  <div id="list"></div>
  <div id="hint"></div>
  <div id="progress"></div>
</div>

<script>
const files = [];
const drop = document.getElementById('drop');
const fi = document.getElementById('fileInput');
const list = document.getElementById('list');
const pdfName = document.getElementById('pdfName');
const pdfBtn = document.getElementById('pdfBtn');
const prog = document.getElementById('progress');
const hint = document.getElementById('hint');

function fmt(n){
  if (n < 1024) return n+' B';
  if (n < 1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  list.innerHTML = '';
  files.forEach((f,i)=>{
    const url = URL.createObjectURL(f.file);
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<img src="'+url+'">'+
      '<div class="inf"><div class="nm">'+escapeHtml(f.file.name)+'</div><div class="sz">'+fmt(f.file.size)+' · 第'+(i+1)+'页</div></div>'+
      '<button class="rm">删除</button>';
    d.querySelector('.rm').addEventListener('click',()=>{ files.splice(i,1); render(); });
    list.appendChild(d);
  });
  hint.textContent = files.length ? '共 '+files.length+' 张 → PDF '+files.length+' 页' : '';
  pdfBtn.disabled = files.length === 0;
}
function addFiles(fl){
  for (const f of fl){
    if (f.type && f.type.indexOf('image/') !== 0) { alert('只能上传图片：'+f.name); continue; }
    files.push({file:f});
  }
  render();
}
drop.addEventListener('click',()=>fi.click());
drop.addEventListener('dragover',(e)=>{ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',(e)=>{ e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
fi.addEventListener('change',()=>{ addFiles(fi.files); fi.value = ''; });

function readAsDataURL(f){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
function loadImg(url){
  return new Promise((res, rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = url;
  });
}

pdfBtn.addEventListener('click', async ()=>{
  if (!files.length) return;
  prog.style.display = 'block';
  pdfBtn.disabled = true;
  try {
    const { jsPDF } = window.jspdf;
    let doc = null;
    const mg = Math.max(0, parseInt(document.getElementById('margin').value, 10) || 0);
    for (let i=0; i<files.length; i++){
      prog.textContent = '正在处理第 '+(i+1)+'/'+files.length+' 张…';
      const f = files[i].file;
      const dataUrl = await readAsDataURL(f);
      const img = await loadImg(dataUrl);
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      // 页面=图片原像素尺寸+边框，图片1:1放置，比例不变
      const pw = w + mg*2, ph = h + mg*2;
      const isPng = dataUrl.indexOf('data:image/png') === 0;
      if (!doc){
        doc = new jsPDF({orientation: pw>ph?'l':'p', unit:'px', format:[pw,ph], compress:true});
      } else {
        doc.addPage([pw,ph], pw>ph?'l':'p');
      }
      doc.addImage(dataUrl, isPng?'PNG':'JPEG', mg, mg, w, h);
    }
    const nm = (pdfName.value.trim() || '图片合集') + '.pdf';
    prog.textContent = '正在生成 PDF…';
    doc.save(nm);
    prog.textContent = '完成！已生成 '+nm+'（'+files.length+' 页）';
  } catch(e){
    prog.textContent = '生成失败：'+e.message;
  }
  pdfBtn.disabled = files.length === 0;
});
</script>
</body>
</html>
