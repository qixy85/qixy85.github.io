<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>图片打包下载</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
 html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333}
 .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
 h1{font-size:20px;margin:8px 0 4px}
 .sub{color:#888;font-size:13px;margin-bottom:16px}
 #drop{background:#fff;border:2px dashed #bbb;border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;transition:.2s}
 #drop.over{border-color:#4363d8;background:#eef2ff}
 #drop .big{font-size:34px}
 #drop .tip{color:#888;font-size:13px;margin-top:6px}
 #fileInput{display:none}
 .bar{display:flex;align-items:center;gap:8px;margin-top:16px}
 .bar input{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box}
 #zipBtn{background:#4363d8;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;white-space:nowrap}
 #zipBtn:disabled{background:#bbb;cursor:not-allowed}
 #list{margin-top:14px}
 .item{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
 .item img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
 .item .inf{flex:1;min-width:0}
 .item .nm{font-size:13px;word-break:break-all}
 .item .sz{color:#999;font-size:11px}
 .item .rm{flex:none;background:#fff;border:1px solid #e0e0e0;color:#c00;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
 #hint{color:#999;font-size:12px;margin-top:10px}
 #progress{display:none;margin-top:12px;background:#fff;border-radius:10px;padding:12px;text-align:center;color:#555;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片打包下载(ZIP)</h1>
  <div class="sub">选择多张图片，打包成一个 ZIP 下载。<b>原图高清直存、不压缩画质</b>（图片仅在本机处理，不会上传）</div>

  <div id="drop">
    <div class="big">📦</div>
    <div class="tip">点击选择图片，或直接拖拽图片到这里<br>支持多选</div>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*">

  <div class="bar">
    <input id="zipName" placeholder="压缩包名称（默认：图片打包）">
    <button id="zipBtn" disabled>打包下载</button>
  </div>

  <div id="list"></div>
  <div id="hint"></div>
  <div id="progress"></div>
</div>

<script>
const files = [];
const drop = document.getElementById('drop');
const fi = document.getElementById('fileInput');
const list = document.getElementById('list');
const zipName = document.getElementById('zipName');
const zipBtn = document.getElementById('zipBtn');
const prog = document.getElementById('progress');
const hint = document.getElementById('hint');

function fmt(n){
  if (n < 1024) return n+' B';
  if (n < 1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  list.innerHTML = '';
  files.forEach((f,i)=>{
    const url = URL.createObjectURL(f.file);
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<img src="'+url+'">'+
      '<div class="inf"><div class="nm">'+escapeHtml(f.file.name)+'</div><div class="sz">'+fmt(f.file.size)+'</div></div>'+
      '<button class="rm">删除</button>';
    d.querySelector('.rm').addEventListener('click',()=>{ files.splice(i,1); render(); });
    list.appendChild(d);
  });
  hint.textContent = files.length ? '已选 '+files.length+' 张，共 '+fmt(files.reduce((s,f)=>s+f.file.size,0)) : '';
  zipBtn.disabled = files.length === 0;
}
function addFiles(fl){
  for (const f of fl){
    if (f.type && f.type.indexOf('image/') !== 0) { alert('只能上传图片：'+f.name); continue; }
    files.push({file:f});
  }
  render();
}
drop.addEventListener('click',()=>fi.click());
drop.addEventListener('dragover',(e)=>{ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',(e)=>{ e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
fi.addEventListener('change',()=>{ addFiles(fi.files); fi.value = ''; });

zipBtn.addEventListener('click', async ()=>{
  if (!files.length) return;
  prog.style.display = 'block';
  prog.textContent = '正在打包 '+files.length+' 张图片…';
  zipBtn.disabled = true;
  try {
    const zip = new JSZip();
    const used = {};
    for (const f of files){
      const data = await f.file.arrayBuffer();
      let name = f.file.name;
      if (used[name]) {
        let i=1;
        const base = f.file.name.replace(/\.[^.]+$/,'');
        const ext = f.file.name.includes('.') ? f.file.name.slice(f.file.name.lastIndexOf('.')) : '';
        do{ name = base+'_'+i+ext; i++; } while(used[name]);
      }
      used[name] = 1;
      zip.file(name, data);
    }
    const blob = await zip.generateAsync({type:'blob', compression:'STORE'}, (meta)=>{ prog.textContent = '正在写入… '+Math.round(meta.percent)+'%'; });
    const a = document.createElement('a');
    const nm = (zipName.value.trim() || '图片打包') + '.zip';
    a.href = URL.createObjectURL(blob);
    a.download = nm;
    document.body.appendChild(a); a.click(); a.remove();
    prog.textContent = '完成！已生成 '+nm+'（'+fmt(blob.size)+'，原图直存未压缩）';
  } catch(e){
    prog.textContent = '打包失败：'+e.message;
  }
  zipBtn.disabled = files.length === 0;
});
</script>
</body>
</html>
