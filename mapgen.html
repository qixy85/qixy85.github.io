<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图生成器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
 html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
 #map{position:absolute;inset:0}
 #side{position:absolute;top:10px;left:10px;z-index:1000;background:rgba(255,255,255,.97);border-radius:10px;
   padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);width:330px;max-height:92vh;overflow:auto;font-size:13px}
 #side h2{margin:0 0 8px;font-size:15px}
 #side .sec{border-top:1px solid #eee;padding-top:8px;margin-top:8px}
 #side button{padding:7px 10px;border:none;border-radius:6px;background:#4363d8;color:#fff;cursor:pointer;font-size:13px}
 #side button.gray{background:#eee;color:#333}
 #side button.warn{background:#e67e22}
 #side input,#side select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #ddd;border-radius:6px;margin:3px 0;font-size:13px}
 #fileInput{display:none}
 #log{max-height:170px;overflow:auto;font-size:12px;color:#555;background:#fafafa;border-radius:6px;padding:6px;margin-top:6px;white-space:pre-wrap}
 .ok{color:#2e7d32}.err{color:#c62828}.warnc{color:#e67e22}
 #searchWrap{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1001;width:min(380px,60vw)}
 #search{width:100%;padding:9px 14px;border:none;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:14px;box-sizing:border-box}
 #searchResults{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:50vh;overflow:auto;display:none;font-size:13px;z-index:1002}
 .sitem{padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer}
 .sitem:hover{background:#f5f5f5}
 .sitem .sg{color:#999;font-size:11px;float:right}
 .leaflet-popup-content{font-size:13px}
 .num-icon div{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
   color:#fff;font-weight:bold;font-size:11px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
 @media (max-width:760px){
   #side{left:6px;right:6px;width:auto;top:auto;bottom:8px;max-height:46vh}
   #searchWrap{top:52px;left:6px;right:6px;transform:none;width:auto}
 }
</style>
</head>
<body>
<div id="map"></div>
<div id="searchWrap"><input id="search" placeholder="搜索：名称 / 国家编码 / 地址 / 负责人"><div id="searchResults"></div></div>
<div id="side">
  <h2>地图生成器 <span id="cnt" style="font-size:12px;color:#888"></span></h2>

  <div>
    <button id="tplBtn" class="gray">下载模板</button>
    <button id="upBtn">上传表格生成</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>

  <div class="sec">
    <b>手动新增机构</b>
    <input id="f_e" placeholder="国家编码(如 H32054002738)">
    <input id="f_c" placeholder="园区代码(如 2476)">
    <input id="f_n" placeholder="机构名称">
    <input id="f_a" placeholder="地址(用于自动定位)">
    <input id="f_p" placeholder="负责人">
    <button id="addBtn">定位并新增</button>
    <button id="delBtn" class="warn">按国家编码删除</button>
  </div>

  <div class="sec">
    负责人筛选: <select id="personSel"><option value="">全部</option></select>
    <button id="expBtn" class="gray">导出当前数据(CSV)</button>
  </div>

  <div class="sec"><b>操作记录</b><div id="log">等待上传…</div></div>
</div>

function log(msg, cls){
  const el = document.getElementById('log');
  el.innerHTML += '<div class="'+(cls||'')+'">'+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

  document.getElementById('cnt').textContent = '('+data.length+'家)';
}
function norm(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[（）()【】]/g,''); }

// ===== 定位:先按名称POI,再按地址门址 =====
async function geocodeInst(name, addr){
  // 1) POI 名称
  try {
    const u1 = 'https://restapi.amap.com/v3/place/text?keywords='+encodeURIComponent(name)+'&city=苏州&key='+KEY+'&offset=10';
    const r1 = await (await fetch(u1)).json();
    if (r1.status==='1' && r1.pois && r1.pois.length){
      const nm = norm(name);
      let core = nm.replace(/苏州工业园区/g,'').replace(/有限公司/g,'').replace(/诊所|门诊部|药房|药店|大药房/g,'');
      let cand = r1.pois.filter(p=>{
        const pn = norm(p.name||'');
        return (core && pn.indexOf(core)>=0) || pn===nm;
      });
      if (cand.length){
        const p = cand[0];
        const lnglat = (p.location||'').split(',');
        if (lnglat.length===2){
          return {lat:parseFloat(lnglat[1]), lng:parseFloat(lnglat[0]), src:'POI名称'};
        }
      }
    }
  } catch(e){}
  // 2) 地址门址
  try {
    const u2 = 'https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(addr)+'&city=苏州&key='+KEY;
    const r2 = await (await fetch(u2)).json();
    if (r2.status==='1' && r2.geocodes && r2.geocodes.length){
      const gs = r2.geocodes;
      const good = gs.find(g=>(g.level==='门址'||g.level==='门牌号') && (g.formatted_address||'').indexOf('工业园区')>=0)
                || gs.find(g=>(g.formatted_address||'').indexOf('工业园区')>=0)
                || gs[0];
      const lnglat = (good.location||'').split(',');
      if (lnglat.length===2){
        return {lat:parseFloat(lnglat[1]), lng:parseFloat(lnglat[0]), src:'地址门址'};
      }
    }
  } catch(e){}
  return null;
}

// ===== 应用表格操作 =====
function pickCol(row, names){
  for (const k in row){
    const kk = norm(k);
    for (const n of names){ if (kk.indexOf(norm(n))>=0) return row[k]; }
  }
  return '';
}

    const needGeo = (act.indexOf('新')>=0) || (act.indexOf('修')>=0 && a && a !== (idx>=0?data[idx].a:''));
    if (needGeo){
      geo = await geocodeInst(n || (idx>=0?data[idx].n:''), a || (idx>=0?data[idx].a:''));
      await new Promise(r=>setTimeout(r,150));
    }
    if (act.indexOf('新')>=0){
      if (idx>=0) { log('△ 已存在,按修改处理: '+e, 'warnc'); }
      if (!geo){ fail++; log('✗ 新增定位失败,已跳过: '+e+' '+n, 'err'); continue; }
      data.push({e:e, c:c||'', n:n, a:a, p:p, lat:geo.lat, lng:geo.lng, t:t||''});
      add++; log('✓ 新增 '+e+' '+n+' ('+geo.src+')', 'ok');
    } else {
      if (idx<0){ fail++; log('✗ 修改失败(编码不存在): '+e, 'err'); continue; }
      const cur = data[idx];
      if (n) cur.n = n;
      if (c) cur.c = c;
      if (a) cur.a = a;
      if (p) cur.p = p;
      if (t) cur.t = t;
      if (geo){ cur.lat = geo.lat; cur.lng = geo.lng; log('✓ 修改 '+e+' '+cur.n+' (重新定位:'+geo.src+')', 'ok'); }
      else log('✓ 修改 '+e+' '+cur.n+' (位置未变)', 'ok');
      mod++;
    }
  }
  log('—— 完成: 新增'+add+' 删除'+del+' 修改'+mod+' 失败'+fail+' ——', 'warnc');
  render();
}
function readTable(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      try {
        const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, {defval:''}));
      } catch(e){ rej(e); }
    };
    fr.onerror = rej;
    fr.readAsArrayBuffer(file);
  });
}

// ===== 地图渲染 =====
const PALETTE = ['#e6194b','#4363d8','#3cb44b','#f58231','#911eb4','#008080','#9a6324','#f032e6','#808000','#000075'];
function pc(p){
  if (!p) return '#888';
  if (!(p in window.__pcol)){ window.__pcol[p] = PALETTE[Object.keys(window.__pcol).length % PALETTE.length]; }
  return window.__pcol[p];
}
window.__pcol = {};
function personList(){ return [...new Set(data.map(m=>m.p).filter(Boolean))].sort(); }
function render(){
  setCount();
  if (layerGroup) map.removeLayer(layerGroup);
  layerGroup = L.layerGroup().addTo(map);
  byE = {};
  // 同址错开
  const cnt = {}, idx = {};
  data.forEach(m=>{ const k=(+m.lat).toFixed(4)+','+(+m.lng).toFixed(4); cnt[k]=(cnt[k]||0)+1; });
  data.forEach(m=>{
    const k=(+m.lat).toFixed(4)+','+(+m.lng).toFixed(4);
    let lat=m.lat, lng=m.lng, same=0;
    if (cnt[k]>1){
      const i = idx[k]=(idx[k]||0)+1;
      const ang=(i-1)/cnt[k]*2*Math.PI, r=0.00016;
      lat = +m.lat + r*Math.cos(ang); lng = +m.lng + r*Math.sin(ang); same = cnt[k];
    }
    const col = pc(m.p);
    const mk = L.marker([lat,lng], {icon:L.divIcon({className:'num-icon',
      html:'<div style="background:'+col+'">●</div>', iconSize:[22,22], iconAnchor:[11,11]})});
    mk.bindPopup('<b>'+m.n+'</b><br>国家编码 '+m.e+' · 园区代码 '+m.c+'<br>'+m.a+
      '<br>负责人: '+(m.p||'—')+(m.t?('<br>检查时间: '+m.t):'')+
      (same?'<div style="color:#c00;font-size:11px">同址共'+same+'家</div>':''));
    mk.addTo(layerGroup);
    byE[m.e] = {mk, m};
  });
  // 负责人下拉
  const sel = document.getElementById('personSel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + personList().map(p=>'<option>'+p+'</option>').join('');
  sel.value = cur;
  applyFilter();
}
function applyFilter(){
  const p = document.getElementById('personSel').value;
  data.forEach(m=>{
    const o = byE[m.e]; if (!o) return;
    const vis = (!p || m.p===p);
    if (vis && !layerGroup.hasLayer(o.mk)) layerGroup.addLayer(o.mk);
    if (!vis && layerGroup.hasLayer(o.mk)) layerGroup.removeLayer(o.mk);
  });
  // 视野
  const pts = data.filter(m=>!p || m.p===p).map(m=>[m.lat,m.lng]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.05));
}

// ===== 搜索 =====
const sIn = document.getElementById('search'), sBox = document.getElementById('searchResults');
function doSearch(){
  const q = sIn.value.trim().toLowerCase();
  if (!q){ sBox.style.display='none'; return; }
  const hits = data.filter(m=>(m.n||'').toLowerCase().indexOf(q)>=0 || (m.e||'').toLowerCase().indexOf(q)>=0 ||
    (m.a||'').toLowerCase().indexOf(q)>=0 || (m.p||'').indexOf(q)>=0);
  sBox.innerHTML = hits.length ? hits.slice(0,40).map((m,i)=>'<div class="sitem" data-i="'+i+'"><b>'+m.n+'</b><span class="sg">'+(m.p||'')+'</span></div>').join('')
    : '<div class="sitem">未找到</div>';
  sBox.style.display='block';
  sBox.querySelectorAll('.sitem[data-i]').forEach(el=>{
    el.onclick = ()=>{
      const m = hits[+el.dataset.i];
      map.flyTo([m.lat,m.lng], Math.max(map.getZoom(),16));
      setTimeout(()=>{ if(byE[m.e]) byE[m.e].mk.openPopup(); }, 500);
      sBox.style.display='none';
    };
  });
}
sIn.addEventListener('input', doSearch);
document.addEventListener('click', e=>{ if(!e.target.closest('#searchWrap')) sBox.style.display='none'; });

// ===== 事件 =====
document.getElementById('upBtn').onclick = ()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async function(){
  const f = this.files[0]; if (!f) return;
  document.getElementById('log').innerHTML='';
  log('读取文件: '+f.name+' …');
  try {
    const rows = await readTable(f);
    log('解析到 '+rows.length+' 行,开始处理…');
    await applyRows(rows);
  } catch(e){ log('✗ 文件解析失败: '+e.message, 'err'); }
  this.value='';
});
document.getElementById('tplBtn').onclick = ()=>{
  const rows = [
    ['国家编码','操作','园区代码','名称','地址','负责人','检查时间'],
    ['H32054002738','新增','2476','苏州工业园区普善诊所','苏州工业园区榭雨街329号太阳星辰三区78幢103室','徐心悦',''],
    ['H32054000000','修改','','机构新名称','苏州工业园区XX路1号','徐心悦',''],
    ['H32054000001','删除','','','','','']
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '变更表');
  XLSX.writeFile(wb, '地图变更模板.xlsx');
};
document.getElementById('addBtn').onclick = async ()=>{
  const e = document.getElementById('f_e').value.trim();
  const c = document.getElementById('f_c').value.trim();
  const n = document.getElementById('f_n').value.trim();
  const a = document.getElementById('f_a').value.trim();
  const p = document.getElementById('f_p').value.trim();
  if (!e || !n || !a){ alert('国家编码、名称、地址必填'); return; }
  log('定位中: '+n+' …');
  const geo = await geocodeInst(n, a);
  if (!geo){ log('✗ 定位失败: '+n, 'err'); return; }
  const idx = data.findIndex(x=>x.e===e);
  if (idx>=0){ data[idx] = {e:e,c:c,n:n,a:a,p:p,lat:geo.lat,lng:geo.lng,t:data[idx].t||''}; log('✓ 已存在,已更新: '+n+' ('+geo.src+')','ok'); }
  else { data.push({e:e,c:c,n:n,a:a,p:p,lat:geo.lat,lng:geo.lng,t:''}); log('✓ 新增: '+n+' ('+geo.src+')','ok'); }
  document.getElementById('f_e').value=document.getElementById('f_c').value=document.getElementById('f_n').value=document.getElementById('f_a').value=document.getElementById('f_p').value='';
  render();
};
document.getElementById('delBtn').onclick = ()=>{
  const e = document.getElementById('f_e').value.trim();
  if (!e){ alert('请在上方"国家编码"框填入要删除的编码'); return; }
  const i = data.findIndex(x=>x.e===e);
  if (i<0){ log('✗ 删除失败(不存在): '+e, 'err'); return; }
  const nm = data[i].n; data.splice(i,1); log('✓ 删除: '+e+' '+nm, 'ok');
  document.getElementById('f_e').value='';
  render();
};
document.getElementById('personSel').addEventListener('change', applyFilter);
document.getElementById('expBtn').onclick = ()=>{
  const head = ['国家编码','园区代码','名称','地址','负责人','检查时间','纬度','经度'];
  const lines = [head.join(',')].concat(data.map(m=>[m.e,m.c,m.n,m.a,m.p,m.t,m.lat,m.lng]
    .map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = '机构数据.csv'; a.click();
};

// ===== 初始化地图 =====
map = L.map('map').setView([31.32,120.72], 12);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'], maxZoom:18, detectRetina:true, attribution:'高德'}).addTo(map);
render();
</script>
